[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Tests, QA tooling and the test framework have no business in a shipped build.
exclude_filter="tests/*, tools/*, addons/gut/*"
export_path="build/windows/HeroesDuel.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
; Packs the game data inside the .exe, so the build is one file to copy or send.
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Heroes Duel"
application/file_description="Heroes Duel"
application/company_name="Heroes Duel"

